<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#14213d">
<title>الفنر</title>
<style>
  :root { --bg:#14213d; --card:#1f2f52; --ok:#2e9e5b; --err:#d64545; --txt:#f2f2f2; --mut:#9fb0d0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--txt);
         font-family:system-ui,"Segoe UI",Tahoma,sans-serif; display:flex; flex-direction:column;
         align-items:center; padding:16px; gap:14px; }
  h1 { margin:6px 0 0; font-size:22px; }
  #status { width:100%; max-width:460px; text-align:center; padding:10px; border-radius:12px;
            background:var(--card); color:var(--mut); font-size:15px; min-height:44px; }
  #status.ok { color:#fff; background:var(--ok); }
  #status.err { color:#fff; background:var(--err); }
  .grid { width:100%; max-width:460px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { border:0; border-radius:18px; color:#fff; font-size:22px; font-weight:700; cursor:pointer;
           font-family:inherit; }
  .ctl { height:130px; background:#3a5bd9; }
  .ctl:active { transform:scale(.97); filter:brightness(1.15); }
  .ctl.up { background:#2e9e5b; } .ctl.down { background:#c9822b; }
  .ctl.lock { background:#7a4fd0; } .ctl.unlock { background:#3a86c9; }
  .ctl .sub { display:block; font-size:13px; font-weight:400; opacity:.85; margin-top:6px; }
  button:disabled { opacity:.45; }
  #connect { width:100%; max-width:460px; height:54px; background:#4b5f91; font-size:18px; }
  .pw { width:100%; max-width:460px; display:flex; gap:8px; }
  .pw input { flex:1; height:46px; border-radius:12px; border:0; padding:0 12px; font-size:16px;
              background:#0f1a31; color:#fff; direction:ltr; text-align:left; }
  .pw button { height:46px; padding:0 18px; background:#4b5f91; font-size:16px; border-radius:12px; }
  small { color:var(--mut); max-width:460px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
<h1>التحكم بالفنر</h1>
<div id="status">غير متصل</div>

<button id="connect">اتصال بالفنر</button>

<div class="grid">
  <button class="ctl up"     data-cmd="U" disabled>صعود</button>
  <button class="ctl down"   data-cmd="D" disabled>نزول</button>
  <button class="ctl lock"   data-cmd="L" disabled>فتح القفل</button>
  <button class="ctl unlock" data-cmd="K" disabled>قفل</button>
</div>

<div class="pw">
  <input id="pass" type="password" placeholder="كلمة السر" autocomplete="off">
  <button id="savepass">حفظ</button>
</div>
<small>تُحفظ كلمة السر في هاتفك فقط. يجب أن تطابق الكلمة المكتوبة في برنامج اللوحة.</small>

<script>
const SVC    = '7f3a1c00-5b2e-4d8a-9c61-2e4f8a1b0001';
const NONCE  = '7f3a1c00-5b2e-4d8a-9c61-2e4f8a1b0002';
const CMD    = '7f3a1c00-5b2e-4d8a-9c61-2e4f8a1b0003';
const STATUS = '7f3a1c00-5b2e-4d8a-9c61-2e4f8a1b0004';

const $ = s => document.querySelector(s);
const statusEl = $('#status');
const btns = [...document.querySelectorAll('.ctl')];
let device = null, nonceC = null, cmdC = null, statusC = null, busy = false;

function setStatus(msg, cls='') { statusEl.textContent = msg; statusEl.className = cls; }
function enable(on) { btns.forEach(b => b.disabled = !on); }

try { $('#pass').value = localStorage.getItem('fanar_pass') || ''; } catch(e) {}
$('#savepass').onclick = () => {
  try { localStorage.setItem('fanar_pass', $('#pass').value); setStatus('تم حفظ كلمة السر','ok'); }
  catch(e) { setStatus('تعذّر الحفظ','err'); }
};

// HMAC-SHA256 ثم أول 16 خانة سداسية (8 بايت) بحروف صغيرة
async function mac16(key, msg) {
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', enc.encode(key), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', k, enc.encode(msg)));
  return [...sig.slice(0,8)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function setup(dev) {
  const server = await dev.gatt.connect();
  const svc = await server.getPrimaryService(SVC);
  nonceC  = await svc.getCharacteristic(NONCE);
  cmdC    = await svc.getCharacteristic(CMD);
  statusC = await svc.getCharacteristic(STATUS);
}

async function connect() {
  if (!navigator.bluetooth) { setStatus('المتصفح لا يدعم البلوتوث. استعمل Chrome على أندرويد','err'); return; }
  try {
    setStatus('جارٍ البحث...');
    if (!device) {
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'Fanar' }], optionalServices: [SVC]
      });
      device.addEventListener('gattserverdisconnected', () => {
        enable(false); setStatus('انقطع الاتصال. اضغط «اتصال»');
      });
    }
    await setup(device);
    enable(true); setStatus('متصل', 'ok');
  } catch (e) {
    enable(false);
    setStatus(e.name === 'NotFoundError' ? 'لم يُختر جهاز' : 'فشل الاتصال: ' + e.message, 'err');
  }
}
$('#connect').onclick = connect;

async function send(cmd, label) {
  if (busy) return;
  const pass = $('#pass').value || (localStorage.getItem('fanar_pass') || '');
  if (!pass) { setStatus('أدخل كلمة السر أولًا','err'); return; }
  busy = true; enable(false);
  try {
    if (!device.gatt.connected) await setup(device);
    const dv = await nonceC.readValue();
    const nonce = new TextDecoder().decode(dv);
    const mac = await mac16(pass, nonce + ':' + cmd);
    await cmdC.writeValueWithResponse(new TextEncoder().encode(cmd + ':' + mac));
    const res = new TextDecoder().decode(await statusC.readValue());
    if (res === 'OK')          { setStatus('تم: ' + label, 'ok'); if (navigator.vibrate) navigator.vibrate(60); }
    else if (res === 'LOCKED') { setStatus('الجهاز مقفل 30 ثانية (محاولات خاطئة)', 'err'); }
    else if (res === 'BUSY')   { setStatus('انتظر لحظة ثم أعد المحاولة', 'err'); }
    else                       { setStatus('كلمة السر غير مطابقة', 'err'); }
  } catch (e) {
    setStatus('فشل الإرسال: ' + e.message, 'err');
  }
  busy = false;
  if (device && device.gatt.connected) enable(true);
}
btns.forEach(b => b.onclick = () => send(b.dataset.cmd, b.textContent.trim()));
</script>
</body>
</html>
